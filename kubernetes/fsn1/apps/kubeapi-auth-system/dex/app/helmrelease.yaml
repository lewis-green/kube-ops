---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
spec:
  interval: 30m
  chart:
    spec:
      chart: dex
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: dex
      interval: 30m
  install:
    crds: CreateReplace
  values:
    commonLabels:
      cloud.stanleygrange.uk/app: dex
    ingress:
      enabled: true
      className: external-nginx
      hosts:
        - host: dex-k8s-fsn1.stanleygrange.uk
          paths:
            - path: /
              pathType: Prefix
    envFrom:
      - secretRef:
          name: dex-environment
    config:
      issuer: https://dex-k8s-fsn1.stanleygrange.uk
      storage:
        type: kubernetes
        config:
          inCluster: true
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            redirectURI: https://dex-k8s-fsn1.stanleygrange.uk/callback
            orgs:
              - name: stanley-grange
      oauth2:
        skipApprovalScreen: true
      staticClients:
        - id: kubectl
          public: true
          name: 'Kubernetes CLI'
          redirectURIs:
            - http://localhost:8000
            - http://localhost:18000
        - id: openziti
          redirectURIs:
            - https://ztna.stanleygrange.uk:8441/zac/callback
          name: 'OpenZiti'
          public: true
      web:
        allowedOrigins: ['*']