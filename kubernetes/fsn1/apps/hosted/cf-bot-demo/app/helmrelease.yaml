---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cf-bot-demo
spec:
  chartRef:
    kind: OCIRepository
    name: cf-bot-demo
  interval: 30m
  values:
    controllers:
      cf-bot-demo:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lewis-green/cf-bot-demo
              tag: 9a4f2ae
            env:
              # HTTP stays on 8080 for the probes; HTTPS uses the Cloudflare Origin CA cert.
              Kestrel__Endpoints__Http__Url: http://+:8080
              Kestrel__Endpoints__Https__Url: https://+:8443
              Kestrel__Endpoints__Https__Certificate__Path: /certs/tls.crt
              Kestrel__Endpoints__Https__Certificate__KeyPath: /certs/tls.key
            envFrom:
              - secretRef:
                  name: cf-bot-demo-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 172.16.100.7
        ports:
          http:
            primary: true
            port: &port 8080
          https:
            port: 443
            targetPort: 8443
    persistence:
      certs:
        type: secret
        name: cf-bot-demo-tls
        globalMounts:
          - path: /certs
            readOnly: true
    ingress:
      app:
        className: external-nginx
        hosts:
          - host: sample.botpoc.openlane.eu
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: *port
