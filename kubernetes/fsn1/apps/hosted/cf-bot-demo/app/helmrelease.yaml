---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cf-bot-demo
spec:
  chartRef:
    kind: OCIRepository
    name: cf-bot-demo
  interval: 30m
  values:
    controllers:
      cf-bot-demo:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lewis-green/cf-bot-demo
              tag: 9a4f2ae
            envFrom:
              - secretRef:
                  name: cf-bot-demo-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 172.16.100.7
        ports:
          http:
            port: &port 8080
    ingress:
      app:
        className: external-nginx
        hosts:
          - host: sample.botpoc.openlane.eu
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: *port
