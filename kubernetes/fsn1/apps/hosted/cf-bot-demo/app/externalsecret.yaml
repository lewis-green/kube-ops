---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-bot-demo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cf-bot-demo-secret
    creationPolicy: Owner
  data:
    - secretKey: Bot__HmacKey
      remoteRef:
        key: cf-bot-demo
        property: hmac_key
    - secretKey: Bot__AccountPepper
      remoteRef:
        key: cf-bot-demo
        property: account_pepper
