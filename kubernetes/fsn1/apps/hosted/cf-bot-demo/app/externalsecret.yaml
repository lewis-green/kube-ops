---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-bot-demo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cf-bot-demo-secret
    creationPolicy: Owner
  data:
    - secretKey: Bot__HmacKey
      remoteRef:
        key: cf-bot-demo
        property: hmac_key
    - secretKey: Bot__AccountPepper
      remoteRef:
        key: cf-bot-demo
        property: account_pepper
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-bot-demo-tls
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cf-bot-demo-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: cf-bot-demo
        property: tls_crt
    - secretKey: tls.key
      remoteRef:
        key: cf-bot-demo
        property: tls_key
