---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-password
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitea-admin-password
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: Gitea-fsn1
        property: username
    - secretKey: password
      remoteRef:
        key: Gitea-fsn1
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-database-credentials
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitea-database-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: Gitea-fsn1
        property: psql_user
    - secretKey: password
      remoteRef:
        key: Gitea-fsn1
        property: psql_password