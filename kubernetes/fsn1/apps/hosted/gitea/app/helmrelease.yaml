---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: gitea
      version: 12.5.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: gitea
  valuesFrom:
    - kind: Secret
      name: gitea-database-credentials
      valuesKey: username
      targetPath: gitea.config.database.USER
    - kind: Secret
      name: gitea-database-credentials
      valuesKey: password
      targetPath: gitea.config.database.PASSWD
  values:    
    replicaCount: 1
    
    ## @param podDisruptionBudget Pod disruption budget
    podDisruptionBudget: {}
    #  maxUnavailable: 1
    #  minAvailable: 1

    ## @section Service
    service:
      http:
        type: ClusterIP
        port: 3000
        clusterIP: None
      ssh:
        type: LoadBalancer
        port: 22
        clusterIP: ''
        annotations:
          external-dns.alpha.kubernetes.io/hostname: &sshHost ssh-git.stanleygrange.uk
          external-dns.alpha.kubernetes.io/target: 144.76.167.25
          lbipam.cilium.io/ips: 172.16.100.6

    ingress:
      enabled: true
      className: external-nginx
      pathType: Prefix
      annotations: {}
      hosts:
        - host: git.stanleygrange.uk
          paths:
            - path: /
      tls: []

    persistence:
      enabled: true
      create: true
      mount: true
      claimName: gitea-shared-storage
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      storageClass: freenas-iscsi

    gitea:
      admin:
        existingSecret: gitea-admin-password
        username: gitea_admin
        email: "gitea@stanleygrange.uk"
        passwordMode: keepUpdated

      # Either specify inline `key` and `secret` or refer to them via `existingSecret`
      ## @param gitea.oauth OAuth configuration
      oauth:
        []
        # - name: 'OAuth 1'
        #   provider:
        #   key:
        #   secret:
        #   existingSecret:
        #   autoDiscoverUrl:
        #   useCustomUrls:
        #   customAuthUrl:
        #   customTokenUrl:
        #   customProfileUrl:
        #   customEmailUrl:

      config:
        APP_NAME: "Stanley Grange Git"
        admin:
          DISABLE_REGULAR_ORG_CREATION: "true"
        database:
          DB_TYPE: postgres
          HOST: gitea-rw.hosted.svc.cluster.local
          NAME: gitea
          SCHEMA: public
        repository:
          DEFAULT_PRIVATE: private
          DEFAULT_BRANCH: main
        security:
          INSTALL_LOCK: "true"
        server:
          ROOT_URL: "https://git.stanleygrange.uk/"
          PUBLIC_URL_DETECTION: "auto"
          SSH_PORT: 22 # rootful image
          SSH_LISTEN_PORT: 2222 # rootless image
          SSH_DOMAIN: *sshHost
        service:
          DISABLE_REGISTRATION: "true"
          REQUIRE_SIGNIN_VIEW: "true"
          
    valkey-cluster:
      persistence:
        storageClass: freenas-iscsi

    postgresql-ha:
      enabled: false

    postgres:
      enabled: false